name: Test Devil Mail Client

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax check
        run: |
          node --check app.js
          node --check sw.js
          node --check core/url.js
          node --check core/storage.js
          node --check core/monitor.js

      - name: Unit tests
        run: node --test tests/url-monitor.test.mjs

      - name: Manifest JSON check
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8')); console.log('manifest ok')"
